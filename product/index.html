<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<script defer src="/md3-lang-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MD3 Scandi — Produit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;500&family=Jost:wght@300;400;500;600&family=Noto+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/md3-header.css?v=26" />
<link rel="stylesheet" href="/md3-responsive.css?v=26" />
<link rel="stylesheet" href="/md3-shop.css?v=28" />
<style>
  body { font-family: 'Jost', sans-serif; background: #fff; color: #1a1816; min-height: 100vh; }
  .product-size-row { margin: 1.25rem 0 0.5rem; }
  .product-size-lbl { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8a8880; margin-bottom: 0.55rem; }
  .product-size-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .product-size-btn {
    min-width: 3.1rem;
    min-height: 2.75rem;
    padding: 0.4rem 0.55rem;
    border: 1px solid rgba(26, 24, 22, 0.22);
    border-radius: 8px;
    background: #fff;
    color: #1a1816;
    font-family: 'Jost', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.12rem;
    line-height: 1.1;
  }
  .product-size-btn:hover:not(:disabled) { border-color: #b8946b; }
  .product-size-btn.active {
    border-color: #1a1816;
    background: #1a1816;
    color: #fff;
    font-weight: 600;
  }
  .product-size-btn--soldout,
  .product-size-btn:disabled {
    opacity: 1;
    cursor: not-allowed;
    color: #9a958c;
    border-color: rgba(26, 24, 22, 0.12);
    background: #f7f5f2;
    text-decoration: none;
  }
  .product-size-btn--soldout:hover,
  .product-size-btn:disabled:hover {
    border-color: rgba(26, 24, 22, 0.12);
  }
  .product-size-code {
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .product-size-soldout {
    font-size: 0.58rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #9a958c;
    white-space: nowrap;
  }
  .product-size-hint { font-size: 0.78rem; color: #c0392b; margin: 0.35rem 0 0; }
</style>
</head>
<body class="product-page">
<script defer src="/md3-viewport.js"></script>

<div id="md3-site-header"></div>

<button type="button" class="product-back" onclick="history.back()">
  <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  <span data-i18n="btn-back">Retour</span>
</button>

<main class="product-page-wrap" id="productWrap">
  <p class="shop-empty-state" style="grid-column:1/-1" data-i18n="product-loading">Chargement…</p>
</main>

<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script defer src="/firebase-config.js"></script>
<script defer src="/md3-firebase.js?v=11"></script>
<script defer src="/md3-sizes.js?v=2"></script>
<script defer src="/md3-store.js?v=34"></script>
<script defer src="/md3-nav-icons.js"></script>
<script defer src="/md3-currency.js?v=6"></script>
<script defer src="/md3-header.js?v=26"></script>
<script defer src="/md3-lang.js?v=44"></script>

<script defer src="/md3-shop-render.js?v=35"></script>
<script defer src="/md3-product-boot.js?v=13"></script>
</body>
</html>
