<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<script defer src="/md3-lang-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MD3 Scandi — Panier</title>
<meta name="description" content="Votre panier MD3 Scandi." />
<link rel="canonical" href="https://md3scandi.com/cart/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cinzel:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/md3-header.css?v=26" />
<link rel="stylesheet" href="/md3-responsive.css?v=26" />
<style>
  :root {
    --cream: #f5f0e8;
    --cream-deep: #ebe3d5;
    --sand: #d9cdb6;
    --bone: #ffffff;
    --ink: #2b2620;
    --ink-soft: #5a5247;
    --gold: #b8935a;
    --danger: #c0392b;
    --shadow: 0 1px 2px rgba(43, 38, 32, 0.04), 0 8px 24px rgba(43, 38, 32, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    color: var(--ink);
    background: var(--cream);
    line-height: 1.6;
    min-height: 100vh;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  .cart-eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 20px;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .cart-eyebrow .line { width: 32px; height: 1px; background: var(--gold); }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 2.75rem);
    font-weight: 300;
    text-align: center;
    margin-bottom: 40px;
  }
  .cart-empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--ink-soft);
    font-size: 15px;
  }
  .cart-empty a {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 28px;
    background: var(--ink);
    color: var(--cream);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: background 0.3s;
  }
  .cart-empty a:hover { background: var(--gold); }
  .cart-list { display: flex; flex-direction: column; gap: 14px; }
  .cart-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bone);
    border: 1px solid rgba(184, 147, 90, 0.15);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .cart-item-visual {
    flex: 0 0 84px;
    width: 84px;
    height: 112px;
    background: linear-gradient(145deg, var(--cream-deep), var(--sand));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .cart-item-visual a {
    display: block;
    width: 100%;
    height: 100%;
  }
  .cart-item-visual img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
  }
  .cart-item-visual span { font-size: 1.75rem; line-height: 1; }
  .cart-item-body {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cart-item-meta {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .cart-item-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 400;
    line-height: 1.2;
    color: var(--ink);
    margin: 0;
  }
  .cart-item-name a {
    color: inherit;
    text-decoration: none;
  }
  .cart-item-name a:hover { color: var(--gold); }
  .cart-item-size {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0;
  }
  .cart-item-price {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    margin: 2px 0 0;
  }
  .cart-item-actions {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .qty-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .qty-btn {
    width: 30px;
    height: 30px;
    border: 1px solid rgba(184, 147, 90, 0.35);
    background: var(--cream);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    color: var(--ink);
    transition: border-color 0.2s;
  }
  .qty-btn:hover { border-color: var(--gold); }
  .qty-val { min-width: 20px; text-align: center; font-weight: 500; color: var(--ink); }
  .cart-item-remove {
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .cart-item-remove:hover { color: var(--danger); }
  .cart-summary {
    margin-top: 36px;
    padding-top: 28px;
    border-top: 1px solid rgba(184, 147, 90, 0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .cart-total-row {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    text-align: center;
    width: 100%;
  }
  .cart-total-row span { color: var(--ink-soft); font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; margin-right: 12px; }
  .btn-continue {
    padding: 14px 28px;
    background: var(--ink);
    color: var(--cream);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: background 0.3s;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-continue:hover { background: var(--gold); }
  .cart-message {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .cart-message-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 5.5vw, 2.15rem);
    font-weight: 400;
    letter-spacing: 0.06em;
    line-height: 1.15;
    text-transform: uppercase;
    color: var(--ink);
    text-align: center;
    margin: 0;
    width: 100%;
  }
  .cart-message-btns {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    width: 100%;
  }
  .btn-msg {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 18px;
    border: 1px solid rgba(184, 147, 90, 0.35);
    background: var(--ink);
    color: var(--cream);
    text-decoration: none;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.25s, border-color 0.25s, color 0.25s;
  }
  .btn-msg:hover { background: var(--gold); border-color: var(--gold); }
  .btn-msg-whatsapp { background: #1f5c45; border-color: #1f5c45; }
  .btn-msg-whatsapp:hover { background: #174836; border-color: #174836; }
  .btn-msg-sms { background: var(--ink); }
  .btn-msg-tiktok { background: #111; border-color: #111; }
  .btn-msg-copy {
    background: transparent;
    color: var(--ink);
    border-color: rgba(184, 147, 90, 0.45);
  }
  .btn-msg-copy:hover {
    background: transparent;
    color: var(--gold);
    border-color: var(--gold);
  }
  .cart-message-note {
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-soft);
    text-align: center;
  }
  .cart-toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--cream);
    padding: 12px 18px;
    font-size: 12px;
    letter-spacing: 0.06em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 300;
    max-width: min(90vw, 420px);
    text-align: center;
  }
  .cart-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  @media (min-width: 520px) {
    .cart-message-btns { grid-template-columns: repeat(3, 1fr); }
    .btn-msg-copy { grid-column: 1 / -1; }
  }
  @media (max-width: 560px) {
    .cart-item {
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 12px 14px;
      padding: 14px;
    }
    .cart-item-visual {
      flex-basis: 72px;
      width: 72px;
      height: 96px;
    }
    .cart-item-body {
      flex: 1 1 calc(100% - 90px);
    }
    .cart-item-actions {
      flex: 1 1 100%;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
      border-top: 1px solid rgba(184, 147, 90, 0.12);
    }
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43, 38, 32, 0.55);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bone);
    border: 1px solid rgba(184, 147, 90, 0.2);
    padding: 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow);
  }
  .confirm-modal { text-align: center; }
  .confirm-modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 300;
    margin-top: 1rem;
  }
  .confirm-modal p { font-size: 0.9rem; color: var(--ink-soft); margin: 0.75rem 0 0; }
  .modal-actions {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid rgba(184, 147, 90, 0.2);
  }
  .btn-cancel {
    background: none;
    border: 1px solid rgba(184, 147, 90, 0.35);
    color: var(--ink-soft);
    padding: 0.65rem 1.25rem;
    font-family: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn-cancel:hover { border-color: var(--gold); color: var(--gold); }
  .btn-confirm {
    background: var(--ink);
    color: var(--cream);
    border: none;
    padding: 0.65rem 1.5rem;
    font-family: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s;
  }
  .btn-confirm:hover { background: var(--gold); }
  .photo-share-modal { max-width: 440px; text-align: center; }
  .photo-share-modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 300;
    margin: 0 0 0.5rem;
  }
  .photo-share-hint {
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin: 0 0 1rem;
    line-height: 1.45;
  }
  .photo-share-thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 1rem;
  }
  .photo-share-thumbs img {
    width: 72px;
    height: 96px;
    object-fit: cover;
    border: 1px solid rgba(184, 147, 90, 0.25);
    background: var(--cream);
  }
  .photo-share-text {
    text-align: left;
    white-space: pre-wrap;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--cream);
    border: 1px solid rgba(184, 147, 90, 0.2);
    padding: 12px;
    max-height: 160px;
    overflow: auto;
    margin: 0 0 0.5rem;
  }
  .photo-share-actions {
    flex-wrap: wrap;
  }
</style>
</head>
<body data-meta-title="meta-title-cart" data-meta-desc="meta-desc-cart">
<script defer src="/md3-viewport.js"></script>

<div id="md3-site-header"></div>

<main>
  <div class="cart-eyebrow">
    <span class="line"></span>
    <span data-i18n="nav-cart">Panier</span>
    <span class="line"></span>
  </div>
  <h1 data-i18n="cart-title">Mon panier</h1>
  <div id="cartContent"></div>
</main>

<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="confirm-modal">
      <div style="font-size:2rem;" id="confirmIcon">🛒</div>
      <h2 id="confirmTitle"></h2>
      <p id="confirmText"></p>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="confirmCancelBtn"><span data-i18n="btn-cancel">Annuler</span></button>
      <button type="button" class="btn-confirm" id="confirmBtn"><span data-i18n="confirm-title">Confirmer</span></button>
    </div>
  </div>
</div>

<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script defer src="/firebase-config.js"></script>
<script defer src="/contact-config.js?v=3"></script>
<script defer src="/md3-firebase.js?v=13"></script>
<script defer src="/md3-sizes.js?v=2"></script>
<script defer src="/md3-store.js?v=36"></script>
<script defer src="/md3-site-assets.js?v=14"></script>
<script defer src="/md3-auth.js?v=4"></script>
<script defer src="/md3-nav-icons.js"></script>
<script defer src="/md3-currency.js?v=6"></script>
<script defer src="/md3-header.js?v=26"></script>
<script defer src="/md3-lang.js?v=45"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
(function () {
  const S = MD3Store;
  const t = (k) => MD3Lang.t(k);
  let toastTimer = null;

  function setNavAuth() {
    MD3Header.updateAuth();
  }

  function updateCartBadge() {
    MD3Header.updateCartBadge();
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function contactCfg() {
    if (window.MD3Contact && typeof MD3Contact.get === 'function') {
      return MD3Contact.get();
    }
    return window.MD3_CONTACT || {};
  }

  function digitsPhone(raw) {
    return String(raw || '').replace(/\D/g, '');
  }

  function absUrl(url) {
    const s = String(url || '').trim();
    if (!s || s.startsWith('data:')) return '';
    if (/^https?:\/\//i.test(s)) return s;
    try {
      return new URL(s, window.location.href).href;
    } catch (_) {
      return '';
    }
  }

  /** Prefer live site links in messages (not localhost). */
  function publicOrigin() {
    const host = String(location.hostname || '');
    if (host === 'localhost' || host === '127.0.0.1' || host === '::1') {
      return 'https://md3scandi.com';
    }
    return location.origin;
  }

  function productPhotoUrl(p) {
    const imgs = (p && Array.isArray(p.images) && p.images.length)
      ? p.images
      : (p && p.image ? [p.image] : []);
    for (let i = 0; i < imgs.length; i++) {
      const u = absUrl(imgs[i]);
      if (u) return u;
    }
    return '';
  }

  function productPageUrl(p) {
    const rel = S.productHref ? S.productHref(p.id) : '/product/?id=' + encodeURIComponent(p.id);
    try {
      return new URL(rel, publicOrigin() + '/').href;
    } catch (_) {
      return absUrl(rel) || rel;
    }
  }

  function lineName(p) {
    return S.productDisplayName
      ? S.productDisplayName(p)
      : MD3Lang.productName
        ? MD3Lang.productName(p)
        : p.name || '';
  }

  function buildCartMessage() {
    // Order text only — never photo URLs or page links (images are attached as files).
    const lines = S.getCartLines();
    const cfg = contactCfg();
    const site = cfg.siteName || 'MD3 Scandi';
    const parts = [
      t('cart-message-hello').replace('%s', site),
      '',
      t('cart-message-intro'),
      '',
    ];
    let total = 0;
    lines.forEach(({ product: p, qty, size }, idx) => {
      total += Number(p.price || 0) * qty;
      parts.push(
        t('cart-message-item')
          .replace('%n', String(idx + 1))
          .replace('%name', lineName(p))
      );
      if (size) parts.push(t('cart-message-size').replace('%s', size));
      parts.push(t('cart-message-qty').replace('%s', String(qty)));
      parts.push('');
    });
    try {
      const eur =
        typeof MD3Currency.formatPriceInSiteLang === 'function'
          ? MD3Currency.formatPriceInSiteLang(total)
          : String(total) + ' €';
      parts.push(t('cart-message-total').replace('%s', eur));
    } catch (_) {
      parts.push(t('cart-message-total').replace('%s', String(total) + ' €'));
    }
    return parts.join('\n').trim();
  }

  function showToast(msg) {
    let el = document.getElementById('cartToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'cartToast';
      el.className = 'cart-toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 4200);
  }

  function copyTextSync(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (_) {
      return false;
    }
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (_) {}
    return copyTextSync(text);
  }

  function openExternal(url) {
    window.location.assign(url);
  }

  function whatsAppUrl(text, phone) {
    const q = 'text=' + encodeURIComponent(text);
    if (phone) return 'https://wa.me/' + phone + '?' + q;
    return 'https://wa.me/?' + q;
  }

  function safeFileBase(name, idx) {
    const base = String(name || 'product')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-zA-Z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 40);
    return (base || 'product') + '-' + (idx + 1);
  }

  async function fetchImageFile(url, fileBase) {
    const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error('image fetch ' + res.status);
    const blob = await res.blob();
    if (!blob || !blob.size) throw new Error('empty image');
    let type = blob.type || 'image/jpeg';
    if (!/^image\//i.test(type)) type = 'image/jpeg';
    const ext = type.indexOf('png') >= 0 ? 'png' : type.indexOf('webp') >= 0 ? 'webp' : 'jpg';
    return new File([blob], fileBase + '.' + ext, { type: type });
  }

  async function collectCartImageFiles() {
    const lines = S.getCartLines();
    const files = [];
    const seen = {};
    for (let i = 0; i < lines.length; i++) {
      const p = lines[i].product;
      const url = productPhotoUrl(p);
      if (!url || seen[url]) continue;
      seen[url] = true;
      try {
        const file = await fetchImageFile(url, safeFileBase(lineName(p), i));
        files.push(file);
      } catch (e) {
        console.warn('cart image share skip', url, e);
      }
      if (files.length >= 10) break;
    }
    return files;
  }

  function downloadFiles(files) {
    files.forEach((file, i) => {
      try {
        const url = URL.createObjectURL(file);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name || ('product-' + (i + 1) + '.jpg');
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2500);
      } catch (e) {
        console.warn('download file', e);
      }
    });
  }

  function closePhotoShareModal() {
    const el = document.getElementById('photoShareModal');
    if (el) el.classList.remove('open');
  }

  function openPhotoShareModal(text, files, channel) {
    let el = document.getElementById('photoShareModal');
    if (!el) {
      el = document.createElement('div');
      el.id = 'photoShareModal';
      el.className = 'modal-overlay';
      el.innerHTML = `
        <div class="modal photo-share-modal">
          <h2 id="photoShareTitle"></h2>
          <p id="photoShareHint" class="photo-share-hint"></p>
          <div id="photoShareThumbs" class="photo-share-thumbs"></div>
          <pre id="photoShareText" class="photo-share-text"></pre>
          <div class="modal-actions photo-share-actions">
            <button type="button" class="btn-confirm" id="photoShareAgain"></button>
            <button type="button" class="btn-confirm" id="photoShareDownload"></button>
            <button type="button" class="btn-cancel" id="photoShareClose"></button>
          </div>
        </div>`;
      document.body.appendChild(el);
      el.addEventListener('click', function (e) {
        if (e.target === el) closePhotoShareModal();
      });
      document.getElementById('photoShareClose').addEventListener('click', closePhotoShareModal);
    }
    el.dataset.channel = channel || '';
    el._shareText = text;
    el._shareFiles = files || [];
    document.getElementById('photoShareTitle').textContent = t('cart-message-attach-title');
    document.getElementById('photoShareHint').textContent = t('cart-message-attach-hint');
    document.getElementById('photoShareText').textContent = text;
    document.getElementById('photoShareAgain').textContent = t('cart-message-attach-share');
    document.getElementById('photoShareDownload').textContent = t('cart-message-attach-download');
    document.getElementById('photoShareClose').textContent = t('btn-cancel') || 'Cancel';
    const thumbs = document.getElementById('photoShareThumbs');
    thumbs.innerHTML = '';
    (files || []).forEach((file) => {
      const img = document.createElement('img');
      img.alt = '';
      img.src = URL.createObjectURL(file);
      img.onload = function () {
        setTimeout(() => URL.revokeObjectURL(img.src), 60000);
      };
      thumbs.appendChild(img);
    });
    document.getElementById('photoShareAgain').onclick = async function () {
      try {
        const ok = await tryShareWithPhotos(el._shareText, el._shareFiles);
        if (ok) closePhotoShareModal();
        else showToast(t('cart-message-share-need-phone'));
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        showToast(t('cart-message-share-need-phone'));
      }
    };
    document.getElementById('photoShareDownload').onclick = async function () {
      downloadFiles(el._shareFiles || []);
      await copyText(el._shareText || '');
      showToast(t('cart-message-downloaded'));
    };
    el.classList.add('open');
  }

  async function tryShareWithPhotos(text, files) {
    if (!files || !files.length || !navigator.share) return false;
    const payload = {
      title: (contactCfg().siteName || 'MD3 Scandi') + ' — ' + (t('cart-title') || 'Cart'),
      text: text,
      files: files,
    };
    // Prefer canShare when available; still try share if it lies on some browsers.
    try {
      if (navigator.canShare && !navigator.canShare({ files: files })) {
        // Some desktop browsers reject files — still attempt once.
      }
    } catch (_) {}
    await navigator.share(payload);
    return true;
  }

  async function sendCartWithImages(channel) {
    showToast(t('cart-message-preparing'));
    const text = buildCartMessage();
    const files = await collectCartImageFiles();
    if (!files.length) {
      showToast(t('cart-message-no-images'));
      await copyText(text);
      return;
    }
    try {
      const shared = await tryShareWithPhotos(text, files);
      if (shared) {
        if (channel === 'sms') showToast(t('cart-message-share-sms-hint'));
        else if (channel === 'whatsapp') showToast(t('cart-message-share-wa-hint'));
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      console.warn('share photos', e);
    }
    // Never fall back to sms:/wa.me with Photo: URLs — show real image attach UI instead.
    openPhotoShareModal(text, files, channel);
  }

  window.messageCartWhatsApp = async function () {
    try {
      if (!S.getCartLines().length) {
        showToast(t('cart-empty'));
        return;
      }
      await sendCartWithImages('whatsapp');
    } catch (e) {
      console.error('messageCartWhatsApp', e);
      alert(t('cart-message-error') || 'Could not open WhatsApp.');
    }
  };

  window.messageCartSms = async function () {
    try {
      if (!S.getCartLines().length) {
        showToast(t('cart-empty'));
        return;
      }
      await sendCartWithImages('sms');
    } catch (e) {
      console.error('messageCartSms', e);
      alert(t('cart-message-error') || 'Could not open SMS.');
    }
  };

  window.messageCartTikTok = async function () {
    try {
      if (!S.getCartLines().length) {
        showToast(t('cart-empty'));
        return;
      }
      await sendCartWithImages('tiktok');
    } catch (e) {
      console.error('messageCartTikTok', e);
      alert(t('cart-message-error') || 'Could not open TikTok.');
    }
  };

  window.copyCartMessage = async function () {
    try {
      const ok = await copyText(buildCartMessage());
      showToast(ok ? t('cart-message-copied') : t('cart-message-copied'));
    } catch (e) {
      console.error('copyCartMessage', e);
      alert(t('cart-message-error') || 'Could not copy.');
    }
  };

  function renderCart() {
    MD3Currency.refreshCurrency();
    const lines = S.getCartLines();
    const el = document.getElementById('cartContent');
    if (!lines.length) {
      el.innerHTML = `<div class="cart-empty">
        <p data-i18n="cart-empty">Votre panier est vide.</p>
        <a href="/#boutique" data-i18n="cart-continue">Continuer mes achats</a>
      </div>`;
      MD3Lang.refreshUI();
      return;
    }
    let total = 0;
    el.innerHTML = `<div class="cart-list">${lines.map(({ key, product: p, qty, size }) => {
      total += p.price * qty;
      const cat = MD3Lang.translateCategory(p.category);
      const sub = MD3Lang.translateSub(p.sub);
      const name = lineName(p);
      const href = S.productHref ? S.productHref(p.id) : '/product/?id=' + encodeURIComponent(p.id);
      const sizeLine = size ? `<p class="cart-item-size">${esc(t('label-size'))}: ${esc(size)}</p>` : '';
      const lineKey = esc(key);
      const thumb = S.productVisualInner
        ? S.productVisualInner(p)
        : (p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" />` : '<span>✦</span>');
      return `<article class="cart-item" data-key="${lineKey}">
        <div class="cart-item-visual"><a href="${esc(href)}" aria-hidden="true" tabindex="-1">${thumb}</a></div>
        <div class="cart-item-body">
          <div class="cart-item-meta">${esc([cat, sub].filter(Boolean).join(' · '))}</div>
          <h2 class="cart-item-name"><a href="${esc(href)}">${esc(name)}</a></h2>
          ${sizeLine}
          <p class="cart-item-price">${MD3Currency.formatPrice(p.price)}</p>
        </div>
        <div class="cart-item-actions">
          <div class="qty-row">
            <span>${t('cart-qty')}</span>
            <button type="button" class="qty-btn" onclick="changeQty(${JSON.stringify(key)}, -1)" aria-label="-">−</button>
            <span class="qty-val">${qty}</span>
            <button type="button" class="qty-btn" onclick="changeQty(${JSON.stringify(key)}, 1)" aria-label="+">+</button>
          </div>
          <button type="button" class="cart-item-remove" onclick="confirmRemoveFromCart(${JSON.stringify(key)})">${t('cart-remove') || 'Remove'}</button>
        </div>
      </article>`;
    }).join('')}</div>
    <div class="cart-summary">
      <p class="cart-total-row"><span data-i18n="cart-total">Total</span>${MD3Currency.formatPrice(total)}</p>
      <div class="cart-message">
        <h2 class="cart-message-title" data-i18n="cart-message-title">Envoyer mon panier au vendeur</h2>
        <div class="cart-message-btns">
          <button type="button" class="btn-msg btn-msg-whatsapp" data-cart-msg="whatsapp">${esc(t('cart-message-whatsapp'))}</button>
          <button type="button" class="btn-msg btn-msg-sms" data-cart-msg="sms">${esc(t('cart-message-sms'))}</button>
          <button type="button" class="btn-msg btn-msg-tiktok" data-cart-msg="tiktok">${esc(t('cart-message-tiktok'))}</button>
          <button type="button" class="btn-msg btn-msg-copy" data-cart-msg="copy">${esc(t('cart-message-copy'))}</button>
        </div>
        <p class="cart-message-note" data-i18n="cart-message-note">Les photos partent en pièces jointes.</p>
      </div>
    </div>`;
    MD3Lang.refreshUI();
  }

  function openConfirmModal(title, text, icon, onConfirm) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text;
    document.getElementById('confirmIcon').textContent = icon;
    document.getElementById('confirmBtn').onclick = () => {
      onConfirm();
      closeConfirmModal();
    };
    document.getElementById('confirmModal').classList.add('open');
  }

  function closeConfirmModal() {
    document.getElementById('confirmModal').classList.remove('open');
  }
  window.closeConfirmModal = closeConfirmModal;

  document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirmModal);

  window.confirmRemoveFromCart = function (lineKey) {
    const lines = S.getCartLines();
    const line = lines.find((l) => l.key === lineKey);
    const p = line ? line.product : null;
    const text = p
      ? t('confirm-cart-remove-named').replace('%s', MD3Lang.productName ? MD3Lang.productName(p) : p.name)
      : t('confirm-cart-remove-text');
    openConfirmModal(t('confirm-cart-remove-title'), text, '🛒', () => {
      removeLine(lineKey).catch(function (e) {
        console.error('removeFromCart', e);
      });
    });
  };

  window.changeQty = async function (lineKey, delta) {
    const lines = S.getCartLines();
    const line = lines.find((l) => l.key === lineKey);
    if (!line) return;
    const next = line.qty + delta;
    if (next <= 0) {
      confirmRemoveFromCart(lineKey);
      return;
    }
    const res = await S.setCartQty(lineKey, next);
    if (!res.ok && delta > 0) alert(t('cart-max-stock'));
    renderCart();
    updateCartBadge();
  };

  async function removeLine(lineKey) {
    try {
      await S.removeFromCart(lineKey);
    } catch (e) {
      console.error('removeFromCart', e);
    }
    renderCart();
    updateCartBadge();
  }

  document.getElementById('confirmModal').addEventListener('click', function (e) {
    if (e.target === this) closeConfirmModal();
  });

  const cartContent = document.getElementById('cartContent');
  if (cartContent) {
    cartContent.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-cart-msg]');
      if (!btn) return;
      e.preventDefault();
      const kind = btn.getAttribute('data-cart-msg');
      if (kind === 'whatsapp') messageCartWhatsApp();
      else if (kind === 'sms') messageCartSms();
      else if (kind === 'tiktok') messageCartTikTok();
      else if (kind === 'copy') copyCartMessage();
    });
  }

  MD3Lang.init({
    onChange() {
      MD3Currency.refreshCurrency();
      MD3Lang.refreshUI();
      setNavAuth(S.getCurrentUser());
      renderCart();
    }
  });

  function bootCart() {
    setNavAuth(S.getCurrentUser());
    renderCart();
  }

  MD3Store.init().then(bootCart).catch(function (e) {
    console.error('MD3Store.init', e);
    bootCart();
  });

  window.addEventListener('pageshow', function () {
    setNavAuth(S.getCurrentUser());
    renderCart();
  });

  window.addEventListener('md3-products-updated', function () {
    renderCart();
  });

  window.addEventListener('md3-currency-changed', function () {
    renderCart();
  });

  window.addEventListener('md3-carts-updated', function () {
    renderCart();
    updateCartBadge();
  });

  window.addEventListener('md3-session-changed', function () {
    setNavAuth(S.getCurrentUser());
    renderCart();
  });

  window.addEventListener('storage', (e) => {
    if (e.key === 'md3_carts' || e.key === 'md3_products') {
      renderCart();
      updateCartBadge();
    }
  });
})();
});
</script>
</body>
</html>
